<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>しばコレマップ</title>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 地図回転 -->
    <script src="https://raruto.github.io/leaflet-rotate/dist/leaflet-rotate.js"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>新発田観光マップ</h1>
    </header>

    <div id="categories">
        <button class="category-btn active" data-category="all">
            すべて
        </button>
        <button class="category-btn" data-category="観光">
            🏯 観光
        </button>
        <button class="category-btn"data-category="グルメ">
            🍴 グルメ
        </button>
        <button class="category-btn"data-category="交通" >
            🚉 交通
        </button>
        <button class="category-btn"data-category="公共施設">
            🏛 公共施設
        </button>
    </div>

    <div id="info">
        地図上のピンをタップしてください。
    </div>

    <div id="map"></div>

    <button id="locationButton">
        ◎
    </button>
    <button id="compassButton">
        🧭
    </button>
<!--開発用-->
    <div id="sensorPanel">
        <div>
            heading :
            <span id="val-heading">
                0
            </span>
        </div>
        <div>
            α :
            <span id="val-alpha">
                0
            </span>
        </div>
        <div>
            β :
            <span id="val-beta">
                0
            </span>
        </div>
        <div>
            γ :
            <span id="val-gamma">
                0
            </span>
        </div>
    </div>

    <!--<div id="arrowMarker">
        ⬆️
    </div>-->
